name: 🐛 问题反馈 (Bug Report)
description: 报告故障。请描述现象并上传日志，版本和安装环境由日志自动提供。
title: "[Bug] 一句话描述问题"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请准备好 **问题描述、复现步骤、日志和截图**。软件版本、源系统、目标镜像、固件、Secure Boot、BitLocker、磁盘结构、所用 PE 以及实体机/虚拟机线索会由新版日志自动记录，不需要手工抄写。

        - ViaPE 安装完成后优先上传合并日志：`<新系统盘>\LetRecovery\Logs\LetRecovery-install-<SessionId>.log`。它已经包含正常系统端和 PE 端日志，不需要重复上传两份原始日志。
        - 如果格式化或首次写入后安装失败，到 `<数据分区>\LetRecovery_Data\LetRecovery\Logs\LetRecovery-install-<SessionId>.log` 查找合并日志。
        - 只有合并日志不存在时，才上传“关于 → 打开日志目录”中的 `<LetRecovery.exe 所在目录>\log\LetRecovery.<日期>.log` 和能够取得的 `<LetRecoveryPE.exe 所在目录>\LetRecoveryPE.log`（正式发布包默认在 `X:\Program Files\LetRecoveryPE\LetRecoveryPE.log`）。

        ⚠️ 没有日志通常无法定位；如确实无法取得，请在日志栏说明原因。
        🔒 上传前请检查并遮盖 BitLocker 恢复密钥、序列号、账号和其他敏感信息。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue / Discussions，确认没有重复
          required: true
        - label: 我已上传对应阶段的日志；无法取得时已在日志栏说明原因
          required: true

  - type: dropdown
    id: stage
    attributes:
      label: 出问题的阶段
      options:
        - 正常系统端（重启进入 PE 之前）
        - PE 端（重启进入 PE 之后）
        - 安装完成、进入新系统之后
        - 不确定
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 问题现象
      description: 说明在哪一步、看到什么提示、卡在多少进度，以及最后发生了什么。
      placeholder: "例如：点击开始安装后，在“校验镜像”阶段停在 27%，随后提示 IMG_VERIFY_FAILED。"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 如何复现
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志文件（必须）
      description: |
        把日志文件直接拖到这里上传，不要只说“没有日志”。
        ViaPE 安装问题优先上传 `<新系统盘>\LetRecovery\Logs\LetRecovery-install-<SessionId>.log`；若安装在格式化或首次写入后失败，则到 `<数据分区>\LetRecovery_Data\LetRecovery\Logs\LetRecovery-install-<SessionId>.log` 查找。只有没有合并日志时，才分别上传正常端与 PE 端原始日志。
        如果日志确实无法取得，请写明具体原因和已经尝试过的查找位置。
      placeholder: "将日志文件拖到这里，或说明无法取得日志的具体原因。"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 上传完整报错界面、卡住的进度和可见诊断代码；请勿只截局部文字。
    validations:
      required: true

  - type: dropdown
    id: image_origin
    attributes:
      label: 镜像来源（仅安装/镜像问题）
      options:
        - 不涉及系统镜像
        - Microsoft 官方原版
        - 第三方修改版
        - 自制备份
        - 不清楚
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      description: 可补充是否偶发、能否稳定复现、换过哪些镜像或磁盘，以及最近做过什么改动。
    validations:
      required: false
